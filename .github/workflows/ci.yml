name: Verify BeeSense
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      NUMBA_NUM_THREADS: "2"
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/dev.txt
            requirements/nlp.lock
            requirements/crawler.txt
            requirements/reddrix.txt
            requirements/selenium.txt
            requirements/coherence.txt
            requirements/instaloader.txt
            requirements/twitter.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Verify shipped dashboard dataset
        run: python -m scripts.verify_dashboard_data --check-git
      - name: Check NLP and dashboard code
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I MachineLearning streamlit_apps.py Dashboard/app.py scripts tests/nlp tests/cloud
          python -m ruff format --isolated --check MachineLearning streamlit_apps.py Dashboard/app.py scripts tests/nlp tests/cloud
      - name: NLP and Streamlit regression tests
        run: python -m unittest discover -s tests/nlp -v
      - name: SocialCrawler offline tests
        run: python -m unittest discover -s tests/crawler -p 'test_social_crawler*.py' -v
      - name: RedditCrawler Reddrix contract tests
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I Crawler/Backend/social_crawler.py Crawler/Backend/reddit_crawler.py tests/crawler/test_reddit_crawler.py tests/crawler/test_social_crawler_reddrix.py
          python -m ruff format --isolated --check Crawler/Backend/social_crawler.py Crawler/Backend/reddit_crawler.py tests/crawler/test_reddit_crawler.py tests/crawler/test_social_crawler_reddrix.py
          python -m unittest discover -s tests/crawler -p test_reddit_crawler.py -v
      - name: InstagramCrawler offline contract tests
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I Crawler/Backend/instagram_crawler.py Crawler/Backend/instagram_browser.py Crawler/Backend/social_export.py tests/crawler/test_instagram_crawler.py tests/crawler/test_instagram_browser.py
          python -m ruff format --isolated --check Crawler/Backend/instagram_crawler.py Crawler/Backend/instagram_browser.py Crawler/Backend/social_export.py tests/crawler/test_instagram_crawler.py tests/crawler/test_instagram_browser.py
          python -m unittest discover -s tests/crawler -p 'test_instagram*.py' -v
      - name: InstaloaderCrawler offline contract tests
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I Crawler/Backend/instaloader_crawler.py Crawler/Backend/instaloader_browser_patch.py tests/crawler/test_instaloader*.py
          python -m ruff format --isolated --check Crawler/Backend/instaloader_crawler.py Crawler/Backend/instaloader_browser_patch.py tests/crawler/test_instaloader*.py
          python -m unittest discover -s tests/crawler -p 'test_instaloader*.py' -v
      - name: TwitterCrawler offline contract tests
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I Crawler/Backend/twitter_crawler.py tests/crawler/test_twitter_crawler.py
          python -m ruff format --isolated --check Crawler/Backend/twitter_crawler.py tests/crawler/test_twitter_crawler.py
          python -m unittest discover -s tests/crawler -p test_twitter_crawler.py -v
      - name: Selenium crawler lint
        run: |
          python -m ruff check --isolated --select E4,E7,E9,F,I Crawler/Backend/social_crawler_selenium.py tests/crawler/test_social_crawler_selenium.py
          python -m ruff format --isolated --check Crawler/Backend/social_crawler_selenium.py tests/crawler/test_social_crawler_selenium.py
      - name: Reddit runner offline tests
        run: python -m unittest discover -s Crawler/Backend/Reddit -p test_crawl_reddit_playwright.py -v
      - name: Browser helper parsers
        run: node --test Crawler/Backend/Reddit/browser_campaign.test.mjs Crawler/Backend/Reddit/browser_campaign_detail.test.mjs Crawler/Backend/Reddit/public_web_post.test.mjs
  dashboard-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      HF_HUB_OFFLINE: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dashboard.txt
      - name: Install Cloud runtime using wheels only
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Open shipped artifacts and all dashboard views without training
        run: python -m unittest discover -s tests/cloud -v
